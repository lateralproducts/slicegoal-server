<!DOCTYPE html>
<html>
<head>
    <style>
        a {cursor: pointer;}
        .negative {
            color: red !important;
            padding-left: 5px;
        }
        .positive {
            color: green;
            padding-left: 5px;
        }
        .flex {
            display: flex;
        }
        .primary-button {
            margin-top: 20px;
            margin-bottom: 20px;
            text-decoration-color: white;
            font-weight: 700;
            font-family: 'Karla', Arial, Verdana, sans-serif;
            font-size:12px;
            border: none;
            text-decoration: none;
            color: rgb(238, 231, 231) !important;
            border-radius: 30px;
            padding: 7px 12px 7px 12px;
            background-color: #27D0FC !important;
            display: inline-block;
        }
        .secondary-button {
            margin-bottom: 20px;
            text-decoration-color: grey;
            font-weight: 700;
            font-family: 'Karla', Arial, Verdana, sans-serif;
            font-size:12px;
            border: solid 2px #27D0FC;
            text-decoration: none;
            color: grey !important;
            border-radius: 30px;
            padding: 7px 12px 7px 12px;
            background-color: white;
        }
       
        u + .body .gmail-blend-screen { background:#000; mix-blend-mode:screen; }
		u + .body .gmail-blend-difference { background:#000; mix-blend-mode:difference; }

    </style>
</head> 

<body>
    <table style="border-collapse: separate; border-spacing: 10px; max-width: 600px; margin: 0 auto;">
        <tr>
            <td align="center">
                <div style="font-size: 1em;">{{ sharerName }} ({{ sharerEmail }}) shared this insight with you.</div>
            </td>
        </tr>
        <tr>
            {{#shareNote}}
            <td align="center">
                <div style="margin-top: 10px; font-size: 1.2em; display:flex; white-space: pre-wrap;">"{{ shareNote }}"</div>
            </td>
            {{/shareNote}}
        </tr>
        <tr>
            <td> 
                <div style="border: dashed 1px rgb(148, 148, 151); border-radius: 3px; padding: 5px;">
                    {{#insightPrompt}}
                    <div style="font-size: 1.2em; font-style: italic; white-space: pre-wrap;">{{ insightPrompt }}</div>
                    {{/insightPrompt}}
                    <div style="font-size: 1.2em; white-space: pre-wrap;">{{ insightText }}</div>
                    {{#filepath}}
                    <img style="margin-top: 20px;" width="600" src="{{filepath}}?ix={{interactionid}}" />
                    {{/filepath}}
                </div>
            </td>
        </tr>
        <tr>
            <td class="button" align="center" style="height: 50px;">
                <a  
                    class="primary-button"
                    href="{{ acceptLink }}"
                >
                    Save Insight
                </a>
            </td>
        </tr>
        <tr>
            <td>
                <div style="background:#000; border-radius: 30px;">
                    <div style="background:#27D0FC; background-image:linear-gradient(#27D0FC,#27D0FC); border-radius: 30px;">
                        <div class="gmail-blend-screen">
                            <div class="gmail-blend-difference">
                                <a href="{{ acceptLink }}" style="margin:0; padding: 7px 12px 7px 12px; font-family: 'Karla', Arial, Verdana, sans-serif; color:#fff; text-align:center;">Save Insight</a>
                                <p style="margin:0; padding:1em; color:#fff; font:bold 2em/1.5 sans-serif; text-align:center;">A</p>
                            </div>
                        </div>
                    </div>
                </div>
			</td>
        </tr>
        <img src='{{pixelpath}}?ix={{interactionid}}'/>
        <tr>
            <td align="center">
                <img width="100" src="{{ logopath }}" />
            </td>
        </tr>
    </table>
</body>
<body class="body" style="margin:0; padding:0; background:#000; font:1em/1.5 sans-serif;">
	<table border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%;">
		<tbody><tr>
			<td>
				<div style="background:#ff0; background-image:linear-gradient(#ff0,#ff0);">
					<div class="gmail-blend-screen">
						<div class="gmail-blend-difference">
							<p style="margin:0; padding:1em; color:#fff; font:bold 2em/1.5 sans-serif; text-align:center;">A</p>
						</div>
					</div>
				</div>
			</td>
        </tr>
	</tbody></table>
</body>
</html>
