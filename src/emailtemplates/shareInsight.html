<!DOCTYPE html>
<html>

<body>
    <table style="border-collapse: separate; border-spacing: 10px;">
        <tr>
            <td>
                <div style="border: solid 0.2px #ECEDF2; border-radius: 3px; padding: 5px;">
                    <div>
                        {{ insightText }}
                    </div>
                    <div style="margin-top: 10px; font-size: 8px; display:flex;">
                        {{ shareNote }}
                    </div>
                </div>
            </td>
        </tr>
        <tr>
            <td class="button">
                <a class="link" style="color-scheme: 'light only'; font-size:11px; font-weight: 700; border: none; text-decoration: none; color: white; border-radius: 7px; padding: 7px 12px 7px 12px; background-color: #27D0FC;"
                    href="{{ acceptLink }}" class="button">Save Insight</a>
            </td>
        </tr>
        <tr style="height:10px">
        </tr>
        <tr>
            <img width="100" src="{{ logopath }}?ix={{ interactionid }}" />
        </tr>

        <tr>
            <div style="font-size:10px">
                {{ sharerName }} ({{ sharerEmail }}) shared this insight with you.
            </div>
        </tr>
    </table>
</body>
<img src='{{pixelpath}}?ix={{interactionid}}'/>

</html>
