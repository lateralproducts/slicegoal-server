<!DOCTYPE html>
<html>
<head>
    <style>
        a {cursor: pointer;}
        .negative {
            color: red !important;
            padding-left: 5px;
        }
        .positive {
            color: green;
            padding-left: 5px;
        }
        .flex {
            display: flex;
        }
        .primary-button {
            margin-top: 20px;
            margin-bottom: 20px;
            text-decoration-color: white;
            font-weight: 700;
            font-family: 'Karla', Arial, Verdana, sans-serif;
            font-size:12px;
            border: none;
            text-decoration: none;
            color: rgb(238, 231, 231) !important;
            border-radius: 30px;
            padding: 7px 12px 7px 12px;
            background-color: #27D0FC !important;
            display: inline-block;
        }
        .secondary-button {
            margin-bottom: 20px;
            text-decoration-color: grey;
            font-weight: 700;
            font-family: 'Karla', Arial, Verdana, sans-serif;
            font-size:12px;
            border: solid 2px #27D0FC;
            text-decoration: none;
            color: grey !important;
            border-radius: 30px;
            padding: 7px 12px 7px 12px;
            background-color: white;
        }
       
        .body .gmail-screen { background:#27D0FC; mix-blend-mode:screen; }
        .body .gmail-difference { background:#27D0FC; mix-blend-mode:difference; }

        @media (prefers-color-scheme: dark) {
            .primary-button {
                color: rgb(238, 231, 231) !important;
                background-color: #27D0FC !important;
            }
            .secondary-button {
                border: solid 2px #27D0FC;
                color: grey;
            }
        }
    </style>
</head> 

<body>
    <table style="border-collapse: separate; border-spacing: 10px; max-width: 600px; margin: 0 auto;">
        <tr>
            <td align="center">
                <div style="font-size: 1em;">{{ sharerName }} ({{ sharerEmail }}) shared this insight with you.</div>
            </td>
        </tr>
        <tr>
            {{#shareNote}}
            <td align="center">
                <div style="margin-top: 10px; font-size: 1.2em; display:flex; white-space: pre-wrap;">"{{ shareNote }}"</div>
            </td>
            {{/shareNote}}
        </tr>
        <tr>
            <td> 
                <div style="border: dashed 1px rgb(148, 148, 151); border-radius: 3px; padding: 5px;">
                    {{#insightPrompt}}
                    <div style="font-size: 1.2em; font-style: italic; white-space: pre-wrap;">{{ insightPrompt }}</div>
                    {{/insightPrompt}}
                    <div style="font-size: 1.2em; white-space: pre-wrap;">{{ insightText }}</div>
                    {{#filepath}}
                    <img style="margin-top: 20px;" width="600" src="{{filepath}}?ix={{interactionid}}" />
                    {{/filepath}}
                </div>
            </td>
        </tr>
        <tr>
            <td class="button" align="center" style="height: 50px;">
                <a  
                    class="primary-button"
                    href="{{ acceptLink }}"
                >
                    Save Insight
                </a>
            </td>
        </tr>
        <tr>
            <td class="button" align="center" style="height: 50px;">
                <p style="color: #ffffff;">
                    <span class="gmail-screen"><span class="gmail-difference">I am white text</span></span>
                </p>
            </td>
        </tr>
        <img src='{{pixelpath}}?ix={{interactionid}}'/>
        <tr>
            <td align="center">
                <img width="100" src="{{ logopath }}" />
            </td>
        </tr>
    </table>
</body>
</html>
