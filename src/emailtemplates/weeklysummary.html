<head>
    <style>
        a {cursor: help;}
        .negative {
            color: red !important;
            padding-left: 5px;
        }
        .positive {
            color: green;
            padding-left: 5px;
        }
        .flex {
            display: flex;
        }
    </style>
</head> 
<br/>
<div><b>Week {{weekdata.week}} Summary</b></div>
<div>{{enddate}}</div>
<br/>
{{#weekdatacomparison}}
    {{#value}}
    <div class="flex">
        <div>{{value}} {{description}}</div> 
        <div class="positive {{#isNegative}}negative{{/isNegative}}">{{delta}}</div>
    </div>
    {{/value}}
{{/weekdatacomparison}}
<br/>
<div><b>Area Time Allocation</b></div>
{{#areapercentages}}
<ul>
    <li><div style="display: flex;">
        <div>{{area}}</div><div class="positive">{{percentage}}%</div> {{#focus}}<img width='10px' height='10px' src='{{focusicon}}'/>{{/focus}}
    </div></li>
</ul>
{{/areapercentages}}
<br/>
<a href="{{ pathurl }}">
    <img width='100' src='{{logopath}}'/>
    <div> </div>
</a>
<img src='{{pixelpath}}?ix={{interactionid}}'/>
