name: Deploy

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Run tests
        run: yarn test

  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build

      - name: Verify compiled server
        run: |
          if [ ! -f dist/index.js ]; then
            echo "dist/index.js missing after artifact download"
            find . -name index.js -print
            exit 1
          fi
          ls -la dist/index.js

      - name: Setup SSH key
        env:
          DEPLOY_KEY: ${{ secrets.SCHRADER_LAPTOP }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "Secret SCHRADER_LAPTOP is empty. Add the full private key (BEGIN/END lines included) under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # GitHub secrets often drop the trailing newline; OpenSSH 10 then fails with
          # "error in libcrypto: unsupported". Strip CR and expand literal \n if needed.
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > SchraderLaptop.pem
          if [ "$(wc -l < SchraderLaptop.pem)" -le 2 ]; then
            awk '{ gsub(/\\n/, "\n") } 1' SchraderLaptop.pem > SchraderLaptop.pem.tmp
            mv SchraderLaptop.pem.tmp SchraderLaptop.pem
          fi
          chmod 600 SchraderLaptop.pem
          if ! ssh-keygen -y -f SchraderLaptop.pem >/dev/null; then
            echo "OpenSSH could not parse SCHRADER_LAPTOP. Re-paste the key as a multiline secret, including -----BEGIN / -----END lines, with a newline after END."
            exit 1
          fi

      - name: Verify SSH connection
        run: |
          ssh -i SchraderLaptop.pem -o StrictHostKeyChecking=no \
            ec2-user@$AWS_SERVER_IP \
            "hostname && echo \"$(date) connected!\" > connection.txt"
        env:
          AWS_SERVER_IP: ${{ secrets.AWS_SERVER_IP }}

      - name: Deploy files to server
        run: |
          echo "Deploying to Production..."
          rsync -e "ssh -i SchraderLaptop.pem -o StrictHostKeyChecking=no" \
            -ru --delete --exclude node_modules --exclude .git --exclude '.env*' ./ \
            ec2-user@$AWS_SERVER_IP:/home/ec2-user/strategyserver/
          rsync -e "ssh -i SchraderLaptop.pem -o StrictHostKeyChecking=no" \
            -ru ./src/emailtemplates \
            ec2-user@$AWS_SERVER_IP:/home/ec2-user/strategyserver/dist/
          rsync -e "ssh -i SchraderLaptop.pem -o StrictHostKeyChecking=no" \
            -ru ./src/files \
            ec2-user@$AWS_SERVER_IP:/home/ec2-user/strategyserver/dist/
          ssh -i SchraderLaptop.pem -o StrictHostKeyChecking=no \
            ec2-user@$AWS_SERVER_IP \
            "test -f /home/ec2-user/strategyserver/dist/index.js"
        env:
          AWS_SERVER_IP: ${{ secrets.AWS_SERVER_IP }}

      - name: Restart pm2 with environment
        run: |
          ssh -i SchraderLaptop.pem -T -o StrictHostKeyChecking=no \
            ec2-user@$AWS_SERVER_IP \
            "export NVM_DIR=\"\$HOME/.nvm\" && \
            . \"\$NVM_DIR/nvm.sh\" && \
            nvm install 24 && \
            nvm alias default 24 && \
            nvm use 24 && \
            (command -v yarn >/dev/null || npm install -g yarn@1.22.22) && \
            (command -v pm2 >/dev/null || npm install -g pm2) && \
            cd /home/ec2-user/strategyserver/ && \
            yarn install --frozen-lockfile && \
            export NODE_ENV=production \
              PAYMENT_API_ENV='$PAYMENT_API_ENV' \
              PAYMENT_API_KEY='$PAYMENT_API_KEY' \
              PAYMENT_API_PASS='$PAYMENT_API_PASS' \
              PAYMENT_MONTHLY_COST='$PAYMENT_MONTHLY_COST' \
              PAYMENT_REDIRECT_URL='$PAYMENT_REDIRECT_URL' \
              COPY_WHEELOFLIFE='$COPY_WHEELOFLIFE' \
              NOTIFICATION_EMAIL='$NOTIFICATION_EMAIL' \
              FEEDBACK_EMAIL='$FEEDBACK_EMAIL' \
              MONGODB_URL='$MONGODB_URL' \
              MONGODB_DB='$MONGODB_DB' \
              MONGODB_USR='$MONGODB_USR' \
              MONGODB_PWD='$MONGODB_PWD' \
              GOOGLE_CLIENTID='$GOOGLE_CLIENTID' \
              PATH_URL='$PATH_URL' \
              EMAILCLIENT_USR='$EMAILCLIENT_USR' \
              AWS_ACCESS_KEY_ID='$AWS_ACCESS_KEY_ID' \
              AWS_SECRET_ACCESS_KEY='$AWS_SECRET_ACCESS_KEY' \
              AWS_DEFAULT_REGION='$AWS_DEFAULT_REGION' \
              AWS_BUCKET='$AWS_BUCKET' \
              REDIS_DB='$REDIS_DB' \
              OPENAI_API_KEY='$OPENAI_API_KEY' \
              FIREBASE_SERVICE_ACCOUNT_KEY_JSON='$FIREBASE_SERVICE_ACCOUNT_KEY_JSON' \
              SPOTIFY_CLIENT_ID='$SPOTIFY_CLIENT_ID' \
              SPOTIFY_CLIENT_SECRET='$SPOTIFY_CLIENT_SECRET' \
              SPOTIFY_REDIRECT_URI='$SPOTIFY_REDIRECT_URI' && \
            (pm2 delete index || true) && \
            pm2 start dist/index.js --name index --interpreter \$(nvm which 24) && \
            pm2 save"
          echo "new version placed on server and started"
        env:
          AWS_SERVER_IP: ${{ secrets.AWS_SERVER_IP }}
          PAYMENT_API_ENV: ${{ secrets.PAYMENT_API_ENV }}
          PAYMENT_API_KEY: ${{ secrets.PAYMENT_API_KEY }}
          PAYMENT_API_PASS: ${{ secrets.PAYMENT_API_PASS }}
          PAYMENT_MONTHLY_COST: ${{ secrets.PAYMENT_MONTHLY_COST }}
          PAYMENT_REDIRECT_URL: ${{ secrets.PAYMENT_REDIRECT_URL }}
          COPY_WHEELOFLIFE: ${{ secrets.COPY_WHEELOFLIFE }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          MONGODB_DB: ${{ secrets.MONGODB_DB }}
          MONGODB_USR: ${{ secrets.MONGODB_USR }}
          MONGODB_PWD: ${{ secrets.MONGODB_PWD }}
          GOOGLE_CLIENTID: ${{ secrets.GOOGLE_CLIENTID }}
          PATH_URL: ${{ secrets.PATH_URL }}
          EMAILCLIENT_USR: ${{ secrets.EMAILCLIENT_USR }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_BUCKET: ${{ secrets.AWS_BUCKET }}
          REDIS_DB: ${{ secrets.REDIS_DB }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_JSON }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}

      - name: Cleanup SSH key
        if: always()
        run: rm -f SchraderLaptop.pem
